ref 1 สุ่มฟรีไปก่อน  1 ที
จากนั้น ลองกดสุ่ม 500 ถ้าสุ่มไม่ได้ก้ไปสุ่ม 100 จน max หรือถ้าสุ่ม500 ได้ก็ไปสุ่ม 100 ต่อจนหมดในฟังชี่น max





step 
เพิ่มstepใหม่ตามนี้ขั้นตอนหลังจากเจอ checkpoint-gacha4 
#step1
โดยเงือนไขแบบใหม่ ให้มันอ่านcoin ตามฟังชั่น 
เช็ค CHECK_COIN-gacha = 1 ไปcopy มาใช้ จากเช็ค CHECK_COIN = 1 
โดยถ้ามันต่ำกว่า สแกนได้ ต่ำกว่า 600 ให้มันมาสุ่ม loop แต่ถ้ามากว่า 700 ให้มันมากกว่า ให้มันปัดเอาเก็บใน coin 700+ ชื่อไฟล์เดิม
พร้อมสแกนชื่อ+[เลข].dat 

#step2
- โดยขั้นตอนใหม่ให้มันทำงานแบบนี้ 
แก้ให้มันปกติมันกดgacha4 ให้มันหา
gacha4v2 -> gacha5v2 แบบนี้คือสุ่มปกตินะ 1ครั้ง ถ้ามันเจอ ให้มันหา checkpointgacha.bmp
แล้วกดnext.bmpซ้ำๆจนกว่าจะหาย แล้วค่อยไปทำงาน gacha500ต่อเลย 

ถ้ามันไม่เจอ gacha4v2 8s ให้มันไปทำงาน gacha500 -> gacha500v1 แทน 
-  แต่ถ้าเจอ ให้มันทำงาน 
จะมี2เงือนไข 
1- ให้มันหา gacha500 -> gacha500v1  ถ้าเจอให้มัน nocions.bmp ให้มันกด back1รอบแล้ว
  แล้วskipไปทำงานขั้นตอนgacha4เลย และก็ถ้ามันเจอout900 ให้มันskipทำงานgacha4เหมือนกัน 

2- แต่มันเจอถ้ามันเจอ หลังจากกด gacha500v1 แล้วมันเจอ 
checkpointgacha.bmp ไม่มีtimeoutนะ ให้มันกดซ้ำๆจนกว่าจะหาย next.bmp  แล้วไปทำงานgacha4ตามจำนวนที่customในconfigไว้เลย 

แต่ถ้าไม่เจอ nocions.bmp ก็ไม่เป็นไร
- แล้วกลับไปgacha4 วนตามจำที่ customในconfig ตามจำนวนloop 

แล้วก็ทางออกจะloopก็ต่อเมื่อเจอoutloopเท่านั้นหลังจากกด gacha4 or ทำงานจำนวนcustomในconfig

ทำให้มันเปิดconfig ได้ด้วยเช่น gacha 500 = 1 ให้มันทำงาน#step1 #step2 

แต่ถ้าเราปิด config = gacha500 = 0 ให้มันทำงานสุ่ม loop ปกติเลย


เพิ่มกรณี
เอาconfigไว้ใต้gacha500 
 -one-gacha500 = 1 
ถ้าเราเปิด  -one-gacha500  = 1 ให้มันทำงานรอบเดียวพอไม่ต้องไปทำงานgacha4อีกรอบ 


ขั้นตอนพวกนี้ ถ้าเปิด find = 1 อย่าให้มันจบการทำงาน "
1	เจอ outloop.bmp	เช็คทุกเฟรมใน 3 ลูป (รอ gacha4 / รอ gacha5 / Loop-Check)
2	เจอ nocions.bmp (coin หมด)	เช็คทุกเฟรมเหมือนกัน
3	ครบจำนวนรอบ GACHA_LOOP_LIMIT	เช็คตอนต้นทุกรอบ (log: ครบ n/n รอบตามที่ตั้ง — break) "

เพิ่มเติมถ้าเราเปิดfind = 1ด้วยให้มันอย่าพึ่ง clear app จบการทำงานให้มันทำงาน

findตามปกติก่อนจนถึงส่งไฟล์ออกมาแล้วค่อยclear app เริ่มใหม่เลย 